<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eDPI Calculator — GlideForge</title>
<meta name="description" content="Calculate your eDPI and cm/360 for Valorant, CS2, Apex and Overwatch 2, compare with pro ranges, and get the right pad size.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root{--bg:#07070c;--bg2:#0d0d15;--card:#111118;--blue:#2f7df6;--blue2:#1e5fd0;--text:#f2f4f8;--muted:#9aa3b2;--line:#1e1e2a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:18px;padding:14px 28px;background:rgba(7,7,12,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:20px;letter-spacing:.5px}
.brand img{height:38px;border-radius:6px}
.links{display:flex;gap:24px;margin-left:auto}
.links a{color:var(--muted);text-decoration:none;font-size:15px}
.links a:hover,.links a.on{color:var(--blue)}
.lang-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.hero{padding:150px 24px 10px;text-align:center;max-width:860px;margin:0 auto}
.hero h1{font-size:clamp(32px,5.5vw,52px);font-weight:900;letter-spacing:.5px;margin-bottom:14px}
.hero p{color:var(--muted);font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:26px 24px 70px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 32px}
.field{margin-bottom:22px}
.field label{display:block;font-weight:700;margin-bottom:8px;font-size:15px}
.field select,.field input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px 16px;font-size:17px;font-family:inherit}
.field select:focus,.field input:focus{outline:none;border-color:var(--blue)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.big{text-align:center;padding:10px 0 4px}
.big strong{display:block;font-size:56px;font-weight:900;color:var(--blue);line-height:1.1}
.big span{color:var(--muted);font-size:14px}
.bar{position:relative;height:12px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;margin:26px 0 8px}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(47,125,246,.35);border-radius:6px}
.bar .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--blue);transform:translate(-50%,-50%)}
.barlbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.verdict{text-align:center;font-size:17px;font-weight:700;margin-top:16px;min-height:28px}
.advice{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:20px;color:var(--muted);font-size:15px}
.advice b{color:var(--text)}
.advice a{color:var(--blue);font-weight:700;text-decoration:none}
footer{border-top:1px solid var(--line);padding:34px 24px;text-align:center;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
@media(max-width:640px){.links{display:none}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="GlideForge logo"><span>GlideForge</span></a>
  <div class="links">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="index.html#products" data-i18n="nav.products">Products</a>
    <a href="tech.html" class="on" data-i18n="nav.tech">Tech Lab</a>
    <a href="fun.html" data-i18n="nav.fun">Fun Zone</a>
    <a href="finder.html" data-i18n="nav.finder">Pad Finder</a>
    <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
  </div>
  <button class="lang-btn" id="langBtn">中文</button>
</nav>

<header class="hero">
  <h1 data-i18n="hero.h1">eDPI Calculator</h1>
  <p data-i18n="hero.sub">Your real sensitivity, in numbers the whole scene understands — plus how much desk it actually needs.</p>
</header>

<main class="wrap">
  <div class="panel">
    <div class="field">
      <label data-i18n="f.game">Game</label>
      <select id="game">
        <option value="valorant">Valorant</option>
        <option value="cs2">CS2</option>
        <option value="apex">Apex Legends</option>
        <option value="ow2">Overwatch 2</option>
      </select>
    </div>
    <div class="row">
      <div class="field">
        <label data-i18n="f.dpi">Mouse DPI</label>
        <input id="dpi" type="number" value="800" min="100" max="32000" step="50">
      </div>
      <div class="field">
        <label data-i18n="f.sens">In-game sensitivity</label>
        <input id="sens" type="number" value="0.31" min="0.01" max="100" step="0.01">
      </div>
    </div>
    <div class="big"><strong id="edpiOut">248</strong><span data-i18n="o.edpi">eDPI (DPI × sensitivity)</span></div>
    <div class="big"><strong id="cmOut" style="font-size:34px">52.7 cm</strong><span data-i18n="o.cm">per 360° turn</span></div>
    <div class="bar"><div class="zone" id="zone"></div><div class="dot" id="dot"></div></div>
    <div class="barlbl"><span id="lblMin"></span><span data-i18n="o.pro">Pro range</span><span id="lblMax"></span></div>
    <div class="verdict" id="verdict"></div>
    <div class="advice" id="advice"></div>
  </div>
</main>

<footer>
  <p>© 2026 GlideForge™. <span data-i18n="footer.rights">All rights reserved.</span> · <a href="index.html">gfpad.com</a></p>
</footer>

<script>
const I18N = {
en: {
"nav.home":"Home","nav.products":"Products","nav.tech":"Tech Lab","nav.fun":"Fun Zone","nav.finder":"Pad Finder","nav.contact":"Contact",
"hero.h1":"eDPI Calculator","hero.sub":"Your real sensitivity, in numbers the whole scene understands — plus how much desk it actually needs.",
"f.game":"Game","f.dpi":"Mouse DPI","f.sens":"In-game sensitivity",
"o.edpi":"eDPI (DPI × sensitivity)","o.cm":"per 360° turn","o.pro":"Pro range",
"v.in":"Right in the pro range. Your settings are scene-standard — any misses are on you now.",
"v.low":"Below the pro range. Great for precision, but your arm is doing overtime — make sure your pad is wide enough.",
"v.high":"Above the pro range. Fast turns, but micro-corrections get twitchy. If your aim shakes, this is why.",
"a.low":"At {cm} cm/360 you are an arm player. You need width: at least a 450 × 400mm pad, ideally the 900mm TITAN desk mat — running out of pad mid-flick is a settings problem you can buy your way out of.",
"a.mid":"At {cm} cm/360 you're in hybrid territory. A 450 × 400mm pad (SWIFT or CONTROL) covers a full 180 with room to spare.",
"a.high":"At {cm} cm/360 you're a wrist player. Any GlideForge size works — pick your surface by feel: SWIFT for glide, CONTROL for stopping power.",
"a.link":"Find your pad →","footer.rights":"All rights reserved."
},
zh: {
"nav.home":"首页","nav.products":"产品","nav.tech":"科技小站","nav.fun":"娱乐专区","nav.finder":"选垫器","nav.contact":"联系我们",
"hero.h1":"eDPI 计算器","hero.sub":"把你的真实灵敏度换算成全圈子都懂的数字——顺便算算它需要多大的桌面。",
"f.game":"游戏","f.dpi":"鼠标 DPI","f.sens":"游戏内灵敏度",
"o.edpi":"eDPI（DPI × 灵敏度）","o.cm":"转身 360° 需要移动",
"v.in":"正好在职业区间里。你的设置是圈内标准配置——接下来打不中就不能怪参数了。",
"v.low":"低于职业区间。精度拉满，但手臂加班严重——确认你的垫子够宽。",
"v.high":"高于职业区间。转身是快，但微修正容易抖。枪法飘，先看看这里。",
"a.low":"{cm} 厘米/360°，你是手臂流。你需要宽度：至少 450×400mm，最好直接 900mm 的 TITAN 桌垫——拉枪拉到一半垫子到头，是个花钱能解决的设置问题。",
"a.mid":"{cm} 厘米/360°，你在混合区间。450×400mm 的垫子（SWIFT 或 CONTROL）足够完成一次完整的 180 度转身还有富余。",
"a.high":"{cm} 厘米/360°，你是手腕流。GlideForge 哪个尺寸都够用——按手感选面：SWIFT 图滑，CONTROL 图停得稳。",
"a.link":"去选你的垫子 →","footer.rights":"保留所有权利。"
}};
const GAMES = {
  valorant: { yaw: 0.07,   proMin: 160,  proMax: 400,  defSens: 0.31, scaleMax: 800 },
  cs2:      { yaw: 0.022,  proMin: 600,  proMax: 1000, defSens: 1.25, scaleMax: 2000 },
  apex:     { yaw: 0.022,  proMin: 800,  proMax: 1600, defSens: 1.5,  scaleMax: 3000 },
  ow2:      { yaw: 0.0066, proMin: 3200, proMax: 6000, defSens: 5.0,  scaleMax: 12000 }
};
let lang = "en";
try { lang = localStorage.getItem("gf-lang") || "en"; } catch(e) {}
const T = k => I18N[lang][k] || k;
function apply(l){
  lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    if (I18N[l][k]) el.innerHTML = I18N[l][k];
  });
  document.getElementById("langBtn").textContent = l === "zh" ? "EN" : "中文";
  document.documentElement.lang = l === "zh" ? "zh-CN" : "en";
  try { localStorage.setItem("gf-lang", l); } catch(e) {}
  calc();
}
document.getElementById("langBtn").addEventListener("click", () => apply(lang === "zh" ? "en" : "zh"));

const gameEl = document.getElementById("game");
const dpiEl = document.getElementById("dpi");
const sensEl = document.getElementById("sens");
gameEl.addEventListener("change", () => { sensEl.value = GAMES[gameEl.value].defSens; calc(); });
dpiEl.addEventListener("input", calc);
sensEl.addEventListener("input", calc);

function calc(){
  const g = GAMES[gameEl.value];
  const dpi = parseFloat(dpiEl.value) || 0;
  const sens = parseFloat(sensEl.value) || 0;
  const edpi = Math.round(dpi * sens);
  const cm = edpi > 0 ? (914.4 / (edpi * g.yaw)) : 0;
  document.getElementById("edpiOut").textContent = edpi || "—";
  document.getElementById("cmOut").textContent = cm ? cm.toFixed(1) + " cm" : "—";
  document.getElementById("lblMin").textContent = g.proMin;
  document.getElementById("lblMax").textContent = g.proMax;
  const zone = document.getElementById("zone");
  zone.style.left = (g.proMin / g.scaleMax * 100) + "%";
  zone.style.width = ((g.proMax - g.proMin) / g.scaleMax * 100) + "%";
  const dot = document.getElementById("dot");
  dot.style.left = Math.min(100, Math.max(0, edpi / g.scaleMax * 100)) + "%";
  const v = document.getElementById("verdict");
  if (!edpi) { v.textContent = ""; }
  else if (edpi < g.proMin) v.textContent = T("v.low");
  else if (edpi > g.proMax) v.textContent = T("v.high");
  else v.textContent = T("v.in");
  const adv = document.getElementById("advice");
  if (!cm) { adv.innerHTML = ""; return; }
  const key = cm >= 45 ? "a.low" : (cm >= 30 ? "a.mid" : "a.high");
  adv.innerHTML = T(key).replace("{cm}", cm.toFixed(1)) + ' <a href="finder.html">' + T("a.link") + "</a>";
}
apply(lang);
</script>
</body>
</html>
